# --- Thông tin site ---
title: "root@"
tagline: "Ghi chú về bảo mật, SOC và những đêm cày log."
description: "Blog cá nhân về bảo mật, SOC và ghi chú kỹ thuật của An Đăng."
author: "An Đăng"
lang: "vi"

baseurl: ""
url: "https://andang241.github.io"

# --- Bài viết ---
permalink: /:year/:month/:day/:title/
timezone: Asia/Ho_Chi_Minh
future: true          # hiện cả bài có mốc giờ "tương lai" so với lúc build

# --- Mạng xã hội (hiện ở footer) ---
social:
  github: "andang241"
  email: "ninjaversusbear241@gmail.com"

# --- Plugin (đều được GitHub Pages hỗ trợ) ---
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# --- Mặc định front matter ---
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"

# --- Bỏ qua khi build ---
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - README.md
