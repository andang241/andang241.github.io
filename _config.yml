# --- Thông tin site ---
title: "root@"
author: "An Dang"
description: "whoami? root — blog về bảo mật, SOC và những đêm cày log."
lang: "vi"

# Repo "andang241.github.io" là user site => baseurl để trống
baseurl: ""
url: "https://andang241.github.io"

# --- Giao diện: theme hacker (chính chủ GitHub Pages) ---
remote_theme: pages-themes/hacker@v0.2.0
show_downloads: false      # ẩn nút Download .zip/.tar ở header

# --- Định dạng bài viết ---
permalink: /:year/:month/:day/:title/
date_format: "%d/%m/%Y"

# --- Plugin (đều nằm trong danh sách GitHub Pages hỗ trợ) ---
plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-feed

# --- Bỏ qua khi build ---
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - README.md
